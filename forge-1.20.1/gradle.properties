# Forge 1.20.1 工程配置
# 1.2.1：修复 issue #1（与 crazyae2addons 等以高优先级 @Overwrite 覆盖
# CraftingService.insertIntoCpus 的模组冲突，导致游戏无法启动）。
# 1.21.1 主线未受该问题影响，其版本号仍为 1.2.0。
mod_version=1.2.1
minecraft_version=1.20.1
forge_version=47.4.28
ae2_version=15.4.11
guideme_version=20.1.7
jade_version=11.13.3+forge
mapping_channel=official
mapping_version=1.20.1
# ForgeGradle 6 只支持 Gradle 8.x，仓库自带 wrapper 已固定为 8.8，直接用 ./gradlew 即可。
org.gradle.jvmargs=-Xmx3G
org.gradle.caching=true
# 构建需要 JDK 17（下方 toolchain 亦锁定 17）。请把 JAVA_HOME 指向 JDK 17 后再执行 gradlew；
# 不要在此写死本机绝对路径，否则换一台机器克隆下来会直接构建失败。
